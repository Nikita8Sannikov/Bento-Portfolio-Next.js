services:
  postgres:
    image: postgres:17-alpine
    container_name: next-portfolio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio

    ports:
      - "5433:5432"

    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: next-portfolio-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: portfolio-secret

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - portfolio_minio_data:/data


volumes:
  portfolio_postgres_data:
  portfolio_minio_data: